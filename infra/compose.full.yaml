services:
  inference:
    build:
      context: ..
      dockerfile: infra/Dockerfile.inference
    environment:
      INFERENCE_KEY: ${INFERENCE_KEY}
      INFERENCE_MODE: ${INFERENCE_MODE:-REAL}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import os,urllib.request; urllib.request.urlopen(urllib.request.Request('http://localhost:8001/health',headers={'X-Inference-Key':os.environ['INFERENCE_KEY']}))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.node
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NODE_ENV: production
      APP_MODE: workspace
      APP_FACILITY_ID: ${APP_FACILITY_ID:-10000000-0000-4000-8000-000000000001}
      API_HOST: 0.0.0.0
      INFERENCE_URL: http://inference:8001
      INFERENCE_KEY: ${INFERENCE_KEY}
      INFERENCE_MODE: ${INFERENCE_MODE:-REAL}
      STORAGE_ADAPTER: ${STORAGE_ADAPTER:-local}
      STORAGE_DIR: /app/.runtime/uploads
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    command:
      [
        'sh',
        '-c',
        'pnpm exec tsx scripts/migrate.ts && pnpm --filter @safesight/api start',
      ]
    volumes: ['uploads:/app/.runtime']
    depends_on:
      db:
        condition: service_healthy
      inference:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.node
    command: ['pnpm', '--filter', '@safesight/web', 'start']
    environment:
      NODE_ENV: production
      WEB_HOST: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: '1'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
  proxy:
    image: nginx:1.28-alpine
    ports: ['127.0.0.1:8080:8080']
    volumes: ['./nginx.conf:/etc/nginx/nginx.conf:ro']
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-q',
          '-O',
          '/dev/null',
          'http://127.0.0.1:8080/api/health',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  uploads:
